<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutant Farm Update 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Signika:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen canvas farm that the camera fits around everything you've unlocked; carved-wood plaques float over it; the market opens as a striped-awning stall sheet. */
:root{
  --wood:#3a281c; --wood-2:#4d3524; --wood-3:#64452d; --edge:#22150d;
  --ink:#fbf1dc; --ink-dim:#d6c09a; --ink-faint:#a89070;
  --leaf:#7cb342; --leaf-d:#4b7c22; --berry:#d4483f; --sky:#8fd0e8;
  --copper:#cf7a3e; --silver:#cfd6de; --gold:#f4c542;
  --f-display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Signika","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;touch-action:manipulation;-webkit-touch-callout:none;background:#6d9442;color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.plaque{background:linear-gradient(180deg,#5b3e29,#3c291c);border:2px solid var(--edge);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,236,200,.14),0 3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.18)}
.num{font-variant-numeric:tabular-nums}

/* coins */
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.14em;flex:none;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75) 0 14%,transparent 16%),radial-gradient(circle,transparent 52%,rgba(0,0,0,.18) 54% 60%,transparent 62%),var(--cc);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 0 0 1.5px rgba(30,18,8,.55)}
.coin.c{--cc:var(--copper)} .coin.s{--cc:var(--silver)} .coin.g{--cc:var(--gold)}
.price{display:inline-flex;gap:.45em;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.price .amt{display:inline-flex;gap:.22em;align-items:center}

/* HUD */
#hud{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#hud-left{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1;align-items:flex-start}
#hud-row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
#hud-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#hud .plaque,#hud button{pointer-events:auto}
.purse{display:flex;gap:12px;align-items:center;padding:6px 12px;font-family:var(--f-display);font-size:21px;letter-spacing:.01em}
.purse .den{display:flex;align-items:center;gap:6px}
.purse.bump{animation:bump .3s ease}
.purse.spend{animation:shake .3s ease}
@keyframes bump{40%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;font-family:var(--f-display);font-size:18px}
.chip img{width:24px;height:24px}
.lvl{gap:10px}
.lv-badge{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a6e06a,#4b7c22);border:2px solid var(--edge);font-size:17px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.lv-meta{display:flex;flex-direction:column;gap:3px;min-width:96px}
.lv-meta small{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.xpbar{height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ad85a,#d6f28a);border-radius:6px;transition:width .5s}
.farmchip small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.farmchip span{font-size:15px;line-height:1.1}
.hbtn{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;font-family:var(--f-display);font-size:17px;border:2px solid var(--edge)}
.hbtn img{width:30px;height:30px}
.hbtn:hover{filter:brightness(1.12)}
.hbtn:active{transform:translateY(2px)}

/* quest */
#quest{width:min(300px,calc(100vw - 32px));padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;transition:transform .3s}
#quest header{display:flex;align-items:center;gap:8px;cursor:pointer}
#quest .qk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
#quest h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1;text-wrap:balance;flex:1}
#quest .qtog{background:none;border:0;padding:2px 4px;color:var(--ink-dim);font-size:14px}
#quest p{margin:0;font-size:14px;line-height:1.35;color:var(--ink-dim)}
#quest .qfoot{display:flex;align-items:center;gap:10px}
#quest .qbar{flex:1;height:10px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
#quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,#f4c542,#ffe28a);transition:width .4s}
#quest .qnum{font-size:13px;font-weight:700;color:var(--ink-dim)}
#quest .qrew{font-size:13px;color:var(--ink-dim);display:flex;gap:6px;align-items:center}
#quest.min p,#quest.min .qrew{display:none}
#quest.done{animation:qdone .7s ease}
@keyframes qdone{30%{transform:scale(1.04);box-shadow:0 0 0 4px var(--gold),0 3px 0 rgba(0,0,0,.35)}}

/* hotbar */
#barwrap{position:fixed;z-index:10;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#barwrap > *{pointer-events:auto}
#bulk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#bar{display:flex;gap:6px;padding:7px;align-items:flex-end;max-width:100%}
.slot{position:relative;width:60px;height:64px;border-radius:11px;border:2px solid #2a1b11;background:linear-gradient(180deg,#6e4c33,#4f3524);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0 3px;box-shadow:inset 0 2px 0 rgba(255,230,190,.12)}
.slot img{width:40px;height:40px;pointer-events:none}
.slot .lbl{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-dim);line-height:1;white-space:nowrap}
.slot .cnt{position:absolute;top:2px;right:3px;min-width:18px;padding:1px 5px;border-radius:9px;background:#22150d;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.slot.none img{opacity:.28;filter:grayscale(1)}
.slot .pips{position:absolute;left:6px;right:6px;bottom:15px;height:5px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.slot .pips i{display:block;height:100%;background:linear-gradient(90deg,#4fb3e8,#9be0ff)}
.slot.sep{margin-left:6px}
.slot:hover{filter:brightness(1.1)}
.slot.flash{animation:bump .35s}
.slot.hint,.hbtn.hint,.tab.hint,.btn.hint,.mk-close.hint{animation:hint 1.1s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(244,197,66,.0),0 3px 0 rgba(0,0,0,.35)}50%{box-shadow:0 0 0 5px rgba(244,197,66,.85),0 3px 0 rgba(0,0,0,.35)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:11px;border:2px solid #1f3b0c;background:linear-gradient(180deg,#8fca4e,#5b9a2c);color:#fff;font-family:var(--f-display);font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #2d4f12;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 1px 0 #2d4f12}
.btn.gold{border-color:#6b4a07;background:linear-gradient(180deg,#ffd866,#e3a521);color:#3b2504;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #7c5408}
.btn.blue{border-color:#123a57;background:linear-gradient(180deg,#6cc3ef,#2f86c0);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #164666}
.btn.plain{border-color:#2a1b11;background:linear-gradient(180deg,#7a5639,#583c28);box-shadow:inset 0 2px 0 rgba(255,230,190,.15),0 3px 0 #22150d}
.btn.red{border-color:#5a1410;background:linear-gradient(180deg,#e2645a,#b23a30);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #5a1410}
.btn.sm{padding:6px 10px;font-size:14px}
.btn[disabled]{filter:grayscale(.85) brightness(.75);cursor:not-allowed;transform:none}
.btn .price{font-family:var(--f-body);font-weight:700;font-size:13px}

/* toasts */
#toasts{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{padding:9px 14px;border-radius:12px;background:rgba(34,21,13,.94);border:2px solid #120b06;font-size:14.5px;line-height:1.3;text-align:center;animation:tin .25s ease;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.toast.good{border-color:#4b7c22}
.toast.warn{border-color:#a8542a}
.toast.out{opacity:0;transform:translateY(6px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* tooltip & popover */
#tip{position:fixed;z-index:30;pointer-events:none;padding:8px 11px;border-radius:10px;background:rgba(30,19,11,.95);border:2px solid #120b06;font-size:13.5px;line-height:1.35;max-width:240px}
#tip b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
#tip .tb{height:6px;border-radius:4px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden}
#tip .tb i{display:block;height:100%;background:#9ad85a}
#pop{position:fixed;z-index:35;width:min(280px,calc(100vw - 32px));padding:12px;display:flex;flex-direction:column;gap:8px}
#pop h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px}
#pop h4 img{width:34px;height:34px}
#pop p{margin:0;font-size:14px;line-height:1.35;color:var(--ink-dim)}
#pop .acts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
#pop .x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:20px;color:var(--ink-dim)}
.pips5{display:flex;gap:4px}
.pips5 i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.4);border:1.5px solid #1a0f08}
.pips5 i.on{background:radial-gradient(circle at 35% 30%,#fff2a8,#e3a521)}

/* sheets */
.mk{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));background:rgba(18,10,4,.5)}
.sheet{width:min(800px,100%);height:min(780px,100%);display:flex;flex-direction:column;background:var(--wood);border:3px solid var(--edge);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);animation:sheetin .28s ease}
@keyframes sheetin{from{opacity:0;transform:translateY(18px) scale(.98)}}
.awning{height:30px;flex:none;position:relative;z-index:2;background:repeating-linear-gradient(90deg,#c8423a 0 34px,#f1e6cc 34px 68px)}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:radial-gradient(circle at 17px 0,#c8423a 0 12px,transparent 12.5px) 0 0/68px 12px repeat-x,radial-gradient(circle at 51px 0,#f1e6cc 0 12px,transparent 12.5px) 0 0/68px 12px repeat-x}
.awning.green{background:repeating-linear-gradient(90deg,#4b7c22 0 34px,#f1e6cc 34px 68px)}
.awning.green::after{background:radial-gradient(circle at 17px 0,#4b7c22 0 12px,transparent 12.5px) 0 0/68px 12px repeat-x,radial-gradient(circle at 51px 0,#f1e6cc 0 12px,transparent 12.5px) 0 0/68px 12px repeat-x}
.sh-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 16px 10px;background:linear-gradient(180deg,#563a27,var(--wood))}
.sh-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;flex:1;min-width:150px;letter-spacing:.01em}
.sh-head .purse{font-size:18px;padding:4px 10px;box-shadow:none}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;flex:none;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:11px;border:2px solid #22150d;background:#4a3222;font-family:var(--f-display);font-size:15px;color:var(--ink-dim);white-space:nowrap;flex:none}
.tab img{width:28px;height:28px}
.tab.on{background:#7a5538;color:var(--ink);box-shadow:inset 0 2px 0 rgba(255,230,190,.18)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{font-family:var(--f-display);font-size:17px;color:var(--gold);margin:8px 2px 0;display:flex;align-items:center;gap:8px}
.sec small{font-family:var(--f-body);font-size:12.5px;color:var(--ink-faint);font-weight:400}
.note{font-size:13.5px;color:var(--ink-faint);margin:0 2px;line-height:1.4}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--wood-2);border:2px solid #2c1d13;border-radius:13px}
.row.locked{opacity:.62}
.row .ic{width:60px;height:60px;border-radius:12px;background:radial-gradient(circle at 50% 60%,#6f8f45,#3f5a26);display:grid;place-items:center;border:2px solid #22150d}
.row .ic img{width:54px;height:54px}
.row .ic.dim{background:radial-gradient(circle at 50% 60%,#5b4a3a,#3a2b1f)}
.row h5{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.15}
.row p{margin:2px 0 0;font-size:13.5px;line-height:1.35;color:var(--ink-dim)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.28);color:var(--ink-dim);white-space:nowrap}
.tag.ok{color:#c8ef94}.tag.bad{color:#ffb4a4}.tag.gold{color:var(--gold)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:15px;background:linear-gradient(135deg,#6a4a30,#4a3222);border:2px solid #22150d}
.hero .pair{display:flex;align-items:center;gap:6px}
.hero .pair img{width:84px;height:84px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#7fb04f,#3d6a24);border:2px solid #22150d}
.hero .pair .arr{font-family:var(--f-display);font-size:22px;color:var(--gold)}
.hero h5{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.hero p{margin:3px 0 8px;font-size:14px;color:var(--ink-dim);line-height:1.4}
.minimap{display:grid;grid-template-columns:repeat(5,22px);gap:4px;padding:8px;border-radius:10px;background:rgba(0,0,0,.25);width:max-content}
.minimap i{width:22px;height:22px;border-radius:5px;border:1.5px solid rgba(0,0,0,.5)}
.minimap i.no{background:rgba(255,255,255,.06);border-style:dashed;border-color:rgba(255,255,255,.12)}
.minimap i.next{background:transparent;border:2px dashed var(--gold)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 12px;color:var(--ink-dim)}
.empty img{width:90px;height:90px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:12px;background:var(--wood-2);border:2px solid #2c1d13}
.stat small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:22px}
.alm{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.alm div{padding:8px;border-radius:12px;background:var(--wood-2);border:2px solid #2c1d13;text-align:center;font-size:12.5px;color:var(--ink-dim)}
.alm img{width:54px;height:54px;display:block;margin:0 auto 2px}
.alm div.lock img{filter:brightness(0) opacity(.45)}
.alm b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--ink)}

/* night */
#night{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;opacity:0;transition:opacity .55s ease;background:linear-gradient(180deg,#0e1533,#25305e 60%,#3a3f6a)}
#night.show{opacity:1}
#night::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#7ec3ea,#ffd9a0 70%,#ffb27a);opacity:0;transition:opacity 1s ease}
#night.morning::before{opacity:1}
#night > *{position:relative}
#night .orb{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffbe8,#e8e2c4);box-shadow:0 0 40px rgba(255,250,220,.5);transition:all 1s ease}
#night.morning .orb{background:radial-gradient(circle at 40% 38%,#fff6c4,#ffc53a);box-shadow:0 0 60px rgba(255,200,60,.8)}
#night h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:44px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#night.morning h2{color:#3a2310;text-shadow:0 2px 0 rgba(255,255,255,.5)}
#night .sub{font-size:16px;line-height:1.5;color:#e6e9ff;max-width:380px}
#night.morning .sub{color:#4a2e14}
#night .sub div{display:flex;align-items:center;justify-content:center;gap:6px}
#night .stars{position:absolute;inset:0;transition:opacity 1s}
#night.morning .stars{opacity:0}
#night .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
#night .zz{font-family:var(--f-display);font-size:22px;color:#c9d2ff;animation:zz 1.4s ease-in-out infinite}
#night.morning .zz{display:none}
@keyframes zz{50%{transform:translateY(-6px);opacity:.6}}

/* banner */
#banner{position:fixed;z-index:65;left:50%;top:22%;transform:translateX(-50%);width:min(420px,calc(100vw - 32px));padding:16px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;animation:bannerin .5s cubic-bezier(.2,1.4,.4,1)}
#banner .kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#banner h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05}
#banner p{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.4}
#banner img{width:72px;height:72px}
#banner .unl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
@keyframes bannerin{from{opacity:0;transform:translate(-50%,-14px) scale(.9)}}

#fly{position:fixed;inset:0;z-index:80;pointer-events:none}
#fly > *{position:absolute;left:0;top:0;will-change:transform}
#fly .coin{width:20px;height:20px}
#fly img{width:30px;height:30px}
#fly .minus{font-family:var(--f-display);font-size:18px;color:#ffb4a4;text-shadow:0 2px 0 rgba(0,0,0,.5)}

.ver{font-size:12px;color:var(--ink-faint)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.lvl{cursor:pointer}
.lvl:hover{filter:brightness(1.1)}
#quest .qhelp{margin:0;padding:0;border:0;background:none;text-align:left;font-size:12.5px;font-weight:600;color:var(--gold);text-decoration:underline;text-underline-offset:2px}
#quest.min .qhelp{display:none}
